[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmprog"
version = "1.0.0"
description = "Predicting investigator-defined gene-program scores from bone marrow trephine morphology in multiple myeloma"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhignya Jagathpally"}]
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "scikit-image>=0.22",
  "tifffile>=2024.8", "imagecodecs", "anndata>=0.10", "h5py>=3.9", "pyyaml>=6", "matplotlib>=3.7",
  "torch>=2.1", "torchvision>=0.16", "timm>=0.9", "statsmodels>=0.14",
]

[project.optional-dependencies]
geo = ["GEOparse>=2.0", "pyarrow"]
clinical = ["lifelines>=0.27"]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
mmprog = "mmprog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: multi-minute CPU tests", "gpu: needs a CUDA device"]

[tool.ruff]
line-length = 120
